<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Code Playground — explore unfamiliar repositories through interactive, source-linked visual explanations. Runs entirely in your browser." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Code Playground</title>
    <script>
      // Apply the saved theme before first paint (dark by default) to avoid a light flash.
      try {
        var t = JSON.parse(localStorage.getItem('code-playground:theme') || '"dark"');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Code Playground needs JavaScript. All processing happens locally in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
